plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yxlanyu.desk144'
    compileSdk 34

    defaultConfig {
        applicationId "com.yxlanyu.desk144"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}